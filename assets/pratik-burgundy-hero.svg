<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
<title id="title">Pratik Kumar — Data Analytics and Business Intelligence</title>
<desc id="desc">A burgundy editorial technology banner with animated orbital paths, a fine grid, and a glowing data core.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset=".52" stop-color="#190B12"/><stop offset="1" stop-color="#2A0D1C"/>
  </linearGradient>
  <linearGradient id="wine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#451126"/><stop offset=".55" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E5B5C7"/><stop offset=".5" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#C77B9B" stop-opacity=".38"/><stop offset=".55" stop-color="#701A3D" stop-opacity=".19"/><stop offset="1" stop-color="#190B12" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#E5B5C7" stroke-opacity=".085" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="clip"><rect width="1600" height="590" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1600" height="590" fill="url(#bg)"/>
  <rect width="1600" height="590" fill="url(#grid)"/>
  <ellipse cx="1240" cy="285" rx="440" ry="350" fill="url(#core)"/>
  <ellipse cx="1240" cy="285" rx="240" ry="190" fill="#701A3D" opacity=".12" filter="url(#soft)"/>
  <path d="M-30 492 C320 420 460 600 805 470 S1320 345 1650 430" stroke="#C77B9B" stroke-opacity=".24" stroke-width="1.5" fill="none"/>
  <path d="M-30 510 C300 445 520 610 840 490 S1360 365 1650 450" stroke="#E5B5C7" stroke-opacity=".16" stroke-width="1" fill="none" stroke-dasharray="3 12"/>
  <g transform="translate(1230 284)" fill="none">
    <ellipse rx="270" ry="96" stroke="#C77B9B" stroke-opacity=".70" stroke-width="2" transform="rotate(-27)"/>
    <ellipse rx="270" ry="96" stroke="#E5B5C7" stroke-opacity=".36" stroke-width="1.4" transform="rotate(32)"/>
    <ellipse rx="216" ry="216" stroke="#C77B9B" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 12"/>
    <ellipse rx="168" ry="168" stroke="#701A3D" stroke-width="30" stroke-opacity=".24"/>
    <circle r="118" fill="#190B12" stroke="url(#rose)" stroke-width="2.5"/>
    <circle r="103" fill="url(#core)"/>
    <path d="M-112 -8 C-68 -80 5 -95 92 -38 C54 38 -13 84 -91 64" stroke="#E5B5C7" stroke-opacity=".72" stroke-width="2.2"/>
    <path d="M-90 45 C-28 7 34 10 101 -44" stroke="#C77B9B" stroke-opacity=".55" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="7" fill="#F8F0F3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="13" stroke="#E5B5C7" stroke-opacity=".8"/>
    <g transform="rotate(-27)">
      <circle cx="270" cy="0" r="6" fill="#F8F0F3" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#F8F0F3">
    <circle cx="985" cy="118" r="2.5" opacity=".75"><animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1450" cy="122" r="2" opacity=".7"><animate attributeName="opacity" values=".2;.8;.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1490" cy="420" r="3" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="480" r="2" opacity=".8"/>
  </g>
  <path d="M84 92H470" stroke="#C77B9B" stroke-opacity=".55"/>
  <path d="M84 92H84" stroke="#F8F0F3" stroke-width="3"><animate attributeName="x2" values="84;470;84" dur="7s" repeatCount="indefinite"/></path>
  <text x="88" y="76" fill="#E5B5C7" font-family="monospace" font-size="16" letter-spacing="5">PERSONAL DATA INTELLIGENCE // PROFILE 001</text>
  <text x="82" y="225" fill="#F8F0F3" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="1.2">PRATIK KUMAR</text>
  <text x="88" y="282" fill="#E5B5C7" font-family="monospace" font-size="23" letter-spacing="2.4">DATA ANALYTICS  /  BUSINESS INTELLIGENCE</text>
  <text x="88" y="338" fill="#F8F0F3" fill-opacity=".82" font-family="Arial, Helvetica, sans-serif" font-size="23">Analyst by mindset. Builder by instinct.</text>
  <text x="88" y="386" fill="#C77B9B" font-family="monospace" font-size="15" letter-spacing="2">POWER BI  ·  SQL  ·  PYTHON  ·  TABLEAU  ·  EXCEL</text>
  <g font-family="monospace" font-size="13" letter-spacing="1.5">
    <rect x="88" y="430" width="180" height="40" rx="20" fill="#451126" stroke="#C77B9B"/>
    <text x="178" y="455" text-anchor="middle" fill="#F8F0F3">MBA // IIT PATNA</text>
    <rect x="282" y="430" width="188" height="40" rx="20" fill="#190B12" stroke="#701A3D"/>
    <text x="376" y="455" text-anchor="middle" fill="#E5B5C7">DATA × BUSINESS</text>
  </g>
  <text x="88" y="535" fill="#A8798D" font-family="monospace" font-size="12" letter-spacing="2.5">EXPLORE  /  EXPLAIN  /  EXPERIMENT  /  EXECUTE</text>
  <path d="M88 553H1510" stroke="#C77B9B" stroke-opacity=".25"/>
</g>
</svg>