<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Pratik Kumar — Data Analytics | Business Intelligence | AI Product Builder</title>
<desc id="heroDesc">Cinematic burgundy SVG hero with a fine technical grid, animated gradient path, orbital geometry, glowing underline and static fallback composition.</desc>
<defs>
 <linearGradient id="heroBackground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".54" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
 <linearGradient id="heroMotion" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#451126"/><stop offset=".5" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/><animate attributeName="x1" values="-1;0;-1" dur="16s" repeatCount="indefinite"/></linearGradient>
 <radialGradient id="heroCore"><stop stop-color="#C77B9B" stop-opacity=".45"/><stop offset=".62" stop-color="#701A3D" stop-opacity=".18"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
 <pattern id="heroGrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#E5B5C7" stroke-opacity=".075"/></pattern>
 <filter id="heroGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="heroClip"><rect width="1600" height="620" rx="28"/></clipPath>
</defs>
<g clip-path="url(#heroClip)">
