<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Pratik Kumar — Data Analytics and Business Intelligence</title>
<desc id="hero-desc">Cinematic burgundy hero with orbital geometry, technical grid, glowing data core and animated paths.</desc>
<defs>
 <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#2B0C1D"/></linearGradient>
 <linearGradient id="hero-edge"><stop stop-color="#451126"/><stop offset=".55" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
 <radialGradient id="hero-core"><stop stop-color="#C77B9B" stop-opacity=".46"/><stop offset="1" stop-color="#190B12" stop-opacity="0"/></radialGradient>
 <pattern id="hero-grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#E5B5C7" stroke-opacity=".08"/></pattern>
 <filter id="hero-glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="hero-clip"><rect width="1600" height="600" rx="28"/></clipPath>
</defs>
<g clip-path="url(#hero-clip)">
 <rect width="1600" height="600" fill="url(#hero-bg)"/><rect width="1600" height="600" fill="url(#hero-grid)"/>
 <ellipse cx="1230" cy="292" rx="450" ry="355" fill="url(#hero-core)"/>
 <path d="M-20 480C300 400 510 598 820 470S1320 346 1640 426" fill="none" stroke="#C77B9B" stroke-opacity=".3"/>
 <g transform="translate(1230 290)" fill="none">
  <ellipse rx="270" ry="98" stroke="#C77B9B" stroke-width="2" stroke-opacity=".8" transform="rotate(-27)"/>
  <ellipse rx="270" ry="98" stroke="#E5B5C7" stroke-width="1.4" stroke-opacity=".4" transform="rotate(32)"/>
  <ellipse rx="215" ry="215" stroke="#C77B9B" stroke-opacity=".35" stroke-dasharray="3 12"/>
  <circle r="116" fill="#190B12" stroke="#E5B5C7" stroke-width="2"/><circle r="100" fill="url(#hero-core)"/>
  <path d="M-108 -8C-60 -83 18 -91 93 -38C54 35 -15 85 -91 62" stroke="#E5B5C7" stroke-width="2"/>
  <circle r="7" fill="#F8F0F3" filter="url(#hero-glow)"/>
  <g><circle cx="270" r="6" fill="#F8F0F3" filter="url(#hero-glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/></g>
 </g>
 <g fill="#F8F0F3"><circle cx="980" cy="120" r="2.5"><animate attributeName="opacity" values=".15;.9;.15" dur="3s" repeatCount="indefinite"/></circle><circle cx="1460" cy="120" r="2"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle><circle cx="1500" cy="430" r="3"/></g>
 <text x="88" y="82" fill="#E5B5C7" font-family="monospace" font-size="15" letter-spacing="5">PERSONAL DATA INTELLIGENCE / PROFILE 001</text>
 <path d="M88 103H520" stroke="#C77B9B" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 432;432 0;0 432" dur="8s" repeatCount="indefinite"/></path>
 <text x="82" y="238" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="82" font-weight="700">PRATIK KUMAR</text>
 <text x="88" y="295" fill="#E5B5C7" font-family="monospace" font-size="21" letter-spacing="2">DATA ANALYTICS / BUSINESS INTELLIGENCE</text>
 <text x="88" y="338" fill="#C77B9B" font-family="monospace" font-size="18">PYTHON DEVELOPER / AI PRODUCT BUILDER</text>
 <text x="88" y="398" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="23">Analyst by mindset. Builder by instinct.</text>
 <g font-family="monospace" font-size="13"><rect x="88" y="438" width="185" height="40" rx="20" fill="#451126" stroke="#C77B9B"/><text x="180" y="463" fill="#F8F0F3" text-anchor="middle">MBA / IIT PATNA</text><rect x="286" y="438" width="200" height="40" rx="20" fill="#190B12" stroke="#701A3D"/><text x="386" y="463" fill="#E5B5C7" text-anchor="middle">DATA × TECHNOLOGY</text></g>
 <text x="88" y="542" fill="#A8798D" font-family="monospace" font-size="12" letter-spacing="2.5">EXPLORE / EXPLAIN / EXPERIMENT / EXECUTE</text><path d="M88 562H1510" stroke="#C77B9B" stroke-opacity=".3"/>
 <text x="88" y="585" fill="#8E6477" font-family="monospace" font-size="10" letter-spacing="3">SIGNAL OVER NOISE • MEASURE WHAT MATTERS</text>
</g></svg>