<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="190" viewBox="0 0 1600 190" role="img" aria-labelledby="footerTitle footerDesc">
<title id="footerTitle">Pratik Kumar — Build with intention</title>
<desc id="footerDesc">Minimal burgundy closing signature with ivory typography and a restrained animated line.</desc>
