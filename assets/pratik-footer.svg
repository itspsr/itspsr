<rect width="1600" height="190" rx="24" fill="url(#footerBackground)" stroke="#701A3D"/>
<path d="M0 30C320 118 515 -8 800 62S1280 126 1600 34" fill="none" stroke="#C77B9B" stroke-opacity=".42"/>
